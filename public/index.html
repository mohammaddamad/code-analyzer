<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>AI Code Analyzer</title>

    <style>
      body {
        font-family: Tahoma, sans-serif;
        padding: 30px;
        background: #f1f5f9;
      }

      textarea {
        width: 100%;
        height: 250px;
        padding: 12px;
        direction: ltr;
        text-align: left;
        font-family: monospace;
        font-size: 15px;
      }

      button {
        padding: 12px 25px;
        margin-top: 15px;
        cursor: pointer;
        background: #2563eb;
        color: white;
        border: none;
      }

      pre {
        background: white;
        padding: 15px;
        white-space: pre-wrap;
        direction: rtl;
      }
    </style>
  </head>

  <body>
    <h2>AI Code Analyzer</h2>

    <p>کد JavaScript خود را وارد کنید:</p>

    <textarea
      id="codeInput"
      placeholder="Write your JavaScript code here..."
    ></textarea>

    <br />

    <button id="analyzeBtn">Analyze Code</button>

    <button id="fixBtn">Auto Fix Code</button>

    <h3>نتیجه:</h3>

    <h3>کد اصلاح‌شده:</h3>

    <textarea
      id="fixedCodeOutput"
      placeholder="Fixed code will appear here..."
      readonly
    ></textarea>

    <br />

    <button id="applyFixBtn" disabled>Apply Fix</button>

    <pre id="result">هنوز کدی تحلیل نشده است.</pre>

    <script>
      const fixButton = document.getElementById("fixBtn");

      const fixedCodeOutput = document.getElementById("fixedCodeOutput");

      const applyFixButton = document.getElementById("applyFixBtn");

      let pendingFixedCode = null;

      // درخواست اصلاح خودکار
      fixButton.addEventListener("click", async () => {
        const code = codeInput.value;

        if (!code.trim()) {
          result.textContent = "لطفاً کد وارد کنید.";

          return;
        }

        fixButton.disabled = true;

        applyFixButton.disabled = true;

        fixedCodeOutput.value = "";

        result.textContent = "در حال اصلاح کد با Qwen...";

        try {
          const response = await fetch("/fix", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              code: code,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.details || data.error || "Fix failed");
          }

          // نگهداری نسخه پیشنهادی
          pendingFixedCode = data.fixedCode;

          // نمایش کد اصلاح شده
          fixedCodeOutput.value = data.fixedCode;

          // فعال کردن دکمه Apply فقط در صورت تغییر
          applyFixButton.disabled = !data.changed;

          // گزارش اصلاحات
          const report = [];

          report.push("===== AUTO FIX REPORT =====");

          report.push(`ESLint changed code: ${data.eslintChanged}`);

          report.push(`Code changed: ${data.changed}`);

          report.push(`Candidate accepted: ${data.candidateAccepted}`);

          report.push("\n===== QWEN SUMMARY =====");

          report.push(data.ai.summary);

          report.push("\n===== CHANGES =====");

          if (data.ai.changes.length === 0) {
            report.push("No changes reported.");
          } else {
            data.ai.changes.forEach((item, index) => {
              report.push(`${index + 1}. ${item}`);
            });
          }

          report.push("\n===== VALIDATION =====");

          report.push(`Lexical: ${data.validation.lexical}`);

          report.push(`Syntax: ${data.validation.syntax}`);

          report.push(`Semantic: ${data.validation.semantic}`);

          if (data.ai.needsReview) {
            report.push("\n⚠️ Some changes need manual review.");
          }

          if (data.validation.remainingDiagnostics.length > 0) {
            report.push("\n===== REMAINING ISSUES =====");

            data.validation.remainingDiagnostics.forEach((item) => {
              report.push(`${item.severity}: ${item.message}`);
            });
          }

          result.textContent = report.join("\n");
        } catch (error) {
          result.textContent = "Fix Error: " + error.message;
        } finally {
          fixButton.disabled = false;
        }
      });

      // جایگزینی کد اصلی با نسخه اصلاح شده
      applyFixButton.addEventListener("click", () => {
        if (pendingFixedCode === null) {
          return;
        }

        codeInput.value = pendingFixedCode;

        result.textContent =
          "✅ نسخه اصلاح شده با تأیید شما جایگزین کد اصلی شد.";

        pendingFixedCode = null;

        applyFixButton.disabled = true;
      });
      
      ///

      const button = document.getElementById("analyzeBtn");
      const codeInput = document.getElementById("codeInput");
      const result = document.getElementById("result");

      button.addEventListener("click", async () => {
        const code = codeInput.value;

        if (!code.trim()) {
          result.textContent = "لطفاً کد وارد کنید.";
          return;
        }

        result.textContent = "در حال تحلیل کد...";

        try {
          const response = await fetch("/analyze", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({ code }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Server Error");
          }

          const lines = [];

          // بررسی لغوی
          if (data.lexical.valid) {
            lines.push("✅ Lexical: No Error");
          } else {
            lines.push("❌ Lexical Error:");
            lines.push(data.lexical.error.message);
          }

          // بررسی نحوی
          if (data.syntax.checked) {
            if (data.syntax.valid) {
              lines.push("\n✅ Syntax: No Error");
            } else {
              lines.push("\n❌ Syntax Error:");
              lines.push(data.syntax.error.message);
            }
          } else {
            lines.push("\nSyntax analysis skipped");
          }

          // بررسی معنایی
          if (data.semantic.checked) {
            lines.push("\n===== SEMANTIC ANALYSIS =====");

            if (data.semantic.diagnostics.length === 0) {
              lines.push("✅ No semantic warnings or errors");
            } else {
              data.semantic.diagnostics.forEach((item) => {
                lines.push(`\n${item.severity.toUpperCase()} - ${item.ruleId}`);

                lines.push(item.message);

                lines.push(`Line: ${item.line}, Column: ${item.column}`);
              });
            }
          } else {
            lines.push("\nSemantic analysis skipped");
          }

          // تحلیل هوش مصنوعی
          lines.push("\n===== QWEN AI ANALYSIS =====");

          if (data.ai?.checked) {
            lines.push(data.ai.summary);

            data.ai.findings.forEach((item) => {
              lines.push(`\n${item.title}`);

              lines.push(`Category: ${item.category}`);

              lines.push(`Line: ${item.line ?? "Unknown"}`);

              lines.push(`Explanation: ${item.explanation}`);

              lines.push(`Suggestion: ${item.suggestion}`);
            });

            if (data.ai.cautions) {
              lines.push(`\nNote: ${data.ai.cautions}`);
            }
          } else {
            lines.push(data.ai?.message || "AI analysis unavailable");
          }

          result.textContent = lines.join("\n");
        } catch (error) {
          result.textContent = "Error: " + error.message;
        }
      });
    </script>
  </body>
</html>
